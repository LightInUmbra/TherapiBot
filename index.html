<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TherapiBot</title>
<meta name="description" content="A friendly listener for hard days. Private: nothing you type leaves your device.">
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --text: #1f2328; --muted: #5b616b; --border: #d9d6cf;
    --bot: #ebe9e3; --user: #2f5d50; --user-text: #ffffff; --accent: #2f5d50; --on-accent: #ffffff;
    --crisis-bg: #fdf0e4; --crisis-text: #6b2e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1d2024; --text: #e8e6e1; --muted: #a3a7ad; --border: #33373d;
      --bot: #262a2f; --user: #3d7a69; --user-text: #ffffff; --accent: #86cdb7; --on-accent: #10231d;
      --crisis-bg: #3a2414; --crisis-text: #ffd9bd;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; max-width: 680px; margin: 0 auto;
  }
  header { padding: 12px 16px 8px; }
  h1 { font-size: 1.15rem; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: .875rem; }
  .crisis { background: var(--crisis-bg); color: var(--crisis-text); }
  .crisis a { color: inherit; font-weight: 600; }
  .banner { padding: 8px 16px; font-size: .9rem; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bot.crisis { background: var(--crisis-bg); }
  .bot a { color: var(--accent); }
  .user { background: var(--user); color: var(--user-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  button { font: inherit; cursor: pointer; border-radius: 999px; padding: 6px 14px;
           border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  form button { background: var(--accent); color: var(--on-accent); border-radius: 10px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
          border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>TherapiBot</h1>
  <p>A friendly listener, not a therapist. Private: nothing you type leaves your device.</p>
</header>
<div class="crisis banner" role="note">
  In crisis? US: call or text <a href="tel:988">988</a> ·
  Anywhere: <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a> ·
  In danger: call your local emergency number.
</div>
<noscript><p class="banner">TherapiBot needs JavaScript to chat. The crisis resources above work without it.</p></noscript>
<div id="log" role="log" aria-live="polite"></div>
<div id="chips"></div>
<form>
  <label for="input" class="sr-only">Your message</label>
  <input id="input" autocomplete="off" placeholder="Type here…">
  <button>Send</button>
</form>

<script>
// Word lists kept in sync with TherapIOT.py (test_TherapIOT.py covers the same cases)
const good = ["happy", "cheerful", "glad", "good", "great", "pleased", "thrilled", "blessed", "content", "joyful",
              "fine", "okay", "ok", "well"];
const bad = ["depressed", "sad", "upset", "suicidal", "worthless", "self harm", "selfharm", "down", "unhappy", "sorrow",
             "sorrowful", "troubled", "anxious", "anxiety attack", "anxiety", "bad", "awful", "terrible"];
const negations = ["not", "no", "never", "isn't", "don't", "aren't", "wasn't", "nothing"];
// Phrases that mean the user may be in danger; checked on EVERY message
const crisis = ["suicid", "kill myself", "end my life", "end it all", "want to die", "wanna die", "better off dead",
                "self harm", "selfharm", "self-harm", "hurt myself", "cut myself", "no reason to live"];
const yes = ["yes", "y", "ya", "yeah", "yea", "yep", "sure", "ok", "okay"];

// Phones type curly apostrophes; normalize so "don’t" matches "don't"
const clean = text => text.toLowerCase().replace(/[’‘]/g, "'");
const isCrisis = text => crisis.some(phrase => clean(text).includes(phrase));
const isYes = text => yes.includes(clean(text).trim());
function isGood(mood) {
  const m = clean(mood), words = m.match(/[a-z']+/g) || [];
  return words.some(w => good.includes(w)) && !words.some(w => negations.includes(w)) && !bad.some(b => m.includes(b));
}

const log = document.getElementById("log"), chips = document.getElementById("chips");
const form = document.querySelector("form"), input = document.getElementById("input");
let pending = null;

function add(cls, parts) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.append(...parts);  // strings become text nodes, so user text can never inject HTML
  log.append(div);
  log.scrollTop = log.scrollHeight;
}
const say = async (...parts) => { await new Promise(r => setTimeout(r, 350)); add("bot", parts); };
function link(text, url) {
  const a = document.createElement("a");
  a.href = url; a.textContent = text; a.target = "_blank"; a.rel = "noopener";
  return a;
}

// Shown the moment anything the user types sounds like they may be in danger
function crisisHelp() {
  add("bot crisis", ["It sounds like you're carrying something really heavy right now.\n" +
    "You don't have to go through this alone. Please reach out to a real person:\n" +
    "• US: call or text ", link("988", "tel:988"), " (", link("988lifeline.org", "https://988lifeline.org/"), ")\n" +
    "• Anywhere else: ", link("findahelpline.com", "https://findahelpline.com"), "\n" +
    "• If you are in immediate danger, call your local emergency number."]);
}

// Waits for the user's next message; optional quick-reply buttons
function ask(options = []) {
  chips.replaceChildren(...options.map(option => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = option; b.onclick = () => submit(option);
    return b;
  }));
  if (!options.length) input.focus();
  return new Promise(resolve => pending = resolve);
}
function submit(text) {
  text = text.trim();
  if (!text || !pending) return;
  const resolve = pending;
  pending = null;
  chips.replaceChildren();
  add("user", [text]);
  // Every message goes through here so a cry for help is never missed, no matter where it's typed
  if (isCrisis(text)) crisisHelp();
  resolve(text);
}
form.onsubmit = e => { e.preventDefault(); submit(input.value); input.value = ""; };

async function run() {
  log.replaceChildren();
  await say("Hello...\nOh! I'm sorry! I haven't asked for your name. So talk to me:\nWhat is your name?");
  let name = await ask();
  await say(`Oh, your name is ${name}?`);
  if (isYes(await ask(["Yes", "No"]))) {
    await say("Alright! Sweet!");
  } else {
    await say("Oh? So what is your name?");
    name = await ask();
    await say(`Alright then, ${name}.\nGlad to meet you. I will do everything I can to help.`);
  }
  await say("So, how is everything?\nGood or Bad?");
  if (isGood(await ask(["Good", "Bad"]))) {
    await say("That's good! I am assuming everything is going well for you then!\nKeep up the good work!");
    return end();
  }
  await say("Oh, I'm sorry to hear. Would you like to vent?\n" +
    "Venting is useful when you're in a bad state of mind.\n" +
    "It's better to let stress out in a positive way, like writing or singing. " +
    "So how about it? Would you like to type about it?\nI'm all ears!");
  if (isYes(await ask(["Yes", "No"]))) return vent();

  await say("If no, then its okay. Any reason in particular you feel the way you feel?\n" +
    "What's going on? I could be of some help, depending of what you need.\n" +
    "Are you...(or feeling)\nSuicidal, depressing moments, no confidence?");
  const reason = clean(await ask(["Suicidal", "Depressing moments", "No confidence"]));
  if (isCrisis(reason)) {
    await say("Whatever you're going through, things can change, and people want to help you through it.\n" +
      "Reaching out is a strong thing to do.");
  } else if (reason.includes("depress")) {
    await say("We all have our ups and downs. Some of us may have it worse. Some of us may " +
      "experience a close one's death, or maybe someone's house burned down. We all have horrid days, " +
      "and some of us lives. Some people spend most of their teens being bullied only for being different. " +
      "What makes all those people, including you, different are the fact you guys are fighters and come out " +
      "doing better than ever. Don't give up! You should read these ",
      link("empowering quotes", "https://www.google.com/search?tbm=isch&safe=active&q=quotes+on+never+giving+up"), ".");
    await say("Hope this helped you feel a bit better!");
  } else if (reason.includes("confide")) {
    await say("We've all been to a point where we have lost ourselves.\n" +
      "So, this ", link("motivational video from Will Smith", "https://www.youtube.com/watch?v=ft_DXwgUXB0"),
      " should help. Watch it.");
  } else {
    await say("Well, it's okay. I understand if you don't trust me. All I want you to know is that I am here to listen.");
  }
  await say('Type in "Thank You" to exit.');
  while (!clean(await ask(["Thank You"])).includes("thank"));
  await say("You're welcome. Take care of yourself!");
  end();
}

// Lets the user send as many messages as they want, then offers to save them
async function vent() {
  await say("I'm glad. You can start typing now.\nSend as many messages as you like, and tap “I'm done” when you're finished.");
  const lines = [];
  for (let text; (text = await ask(["I'm done"])) !== "I'm done";) lines.push(text);
  if (!lines.length) {
    await say("That's okay. Sometimes it's hard to find the words.");
    return end();
  }
  await say("Would you like to save your typing?\nIt downloads as a text file to your device. Nothing is sent anywhere.");
  if (isYes(await ask(["Yes", "No"]))) {
    download(lines.join("\n") + "\n");
    await say("Thank you for dedicating time to yourself. You needed it.\nHope you get better soon!");
  } else {
    await say("Alright. I'll see you soon then!");
  }
  end();
}

function download(text) {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = `TherapiBot vent ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}-${p(d.getMinutes())}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function end() {
  await ask(["Start over"]);
  run();
}

run();
</script>
</body>
</html>
